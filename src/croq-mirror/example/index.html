<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>croq-mirror — standalone example</title>
<link rel="stylesheet" href="../dist/croq-mirror.css">
<style>
body { margin:24px; font:16px system-ui; color:#403830; background:#faf9f7; }
.editors { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
.container { height:480px; border:1px solid #ccc; resize:vertical; overflow:hidden; }
button { padding:8px; margin:4px 2px; } pre { white-space:pre-wrap; }
@media(max-width:800px) { .editors { grid-template-columns:1fr; } }
</style>
<h1>croq-mirror</h1>
<p>独立した2つのエディタです。以下の操作ボタンは利用側のサンプルで、部品には含まれません。</p>
<div class="editors"><section><h2>日本語</h2><div id="ja" class="container"></div>
<button id="undo">Undo</button><button id="format">整形</button><button id="analysis">解析結果</button>
<button id="readonly">読み取り専用</button><button id="disabled">操作無効</button><button id="recreate">破棄・再生成</button>
</section><section><h2>English</h2><div id="en" class="container"></div></section></div>
<pre id="status" aria-live="polite">準備中…</pre>
<script type="module">
import { createEditor } from '../dist/index.js';
const status = document.querySelector('#status');
const sample = 'function greet(name) {\n\tconst message = "Hello, " + name;\n\tif (name) {\n\t\tconsole.log(message);\n\t}\n}\n\ngreet("Croqujs");';
let left;
try {
	left = await createEditor(document.querySelector('#ja'), { value: sample, functionLineNumbers: true });
	const right = await createEditor(document.querySelector('#en'), { language: 'en', value: sample, fontSize: 18 });
	document.querySelector('#undo').onclick = () => left.execute('undo');
	document.querySelector('#format').onclick = () => left.execute('format');
	document.querySelector('#analysis').onclick = async () => {
		status.textContent = JSON.stringify(await left.analyzeNow(), null, 2);
	};
	for (const key of ['readonly', 'disabled']) document.querySelector('#' + key).onclick = () => {
		const setting = key === 'readonly' ? 'readOnly' : key;
		left.setSettings({
			[setting]: !left.getSettings()[setting], });
		status.textContent = JSON.stringify(left.getState());
	};
	document.querySelector('#recreate').onclick = async () => {
		const value = left.getValue();
		left.destroy();
		left = await createEditor(document.querySelector('#ja'), { value });
		status.textContent = '再生成しました。';
	};
	status.textContent = '準備完了。IME入力、検索、補完、サイズ変更を試せます。';
} catch (error) { status.textContent = error.stack; }
</script>
</html>
